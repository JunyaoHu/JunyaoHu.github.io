<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Junyao Desktop — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
	:root {
		--orange: #e95420;
		--bar: #0f0f0f;
		--win: #fafafa;
		--head: #ebebeb;
		--line: rgba(0, 0, 0, 0.1);
		--text: #3d3d3d;
		--muted: #7a7a7a;
		--sel: rgba(233, 84, 32, 0.12);
		--font: 'Ubuntu', system-ui, sans-serif;
		--mono: 'Ubuntu Mono', 'JetBrains Mono', Consolas, monospace;
		--top: 32px;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: var(--text); background: #000; font-size: 14px; }
	button { font: inherit; color: inherit; }
	a { color: var(--orange); }
	.dim { color: var(--muted); }

	/* ── wallpaper ── */
	#wall { position: fixed; inset: 0; z-index: 0; }
	#wall svg { width: 100%; height: 100%; display: block; }

	/* ── splash / login ── */
	#splash { position: fixed; inset: 0; z-index: 9000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #fff; transition: opacity .5s; }
	#splash .mark { font-size: 40px; font-weight: 300; }
	#splash .mark b { color: var(--orange); font-weight: 700; }
	.dots { display: flex; gap: 10px; }
	.dots i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .25; animation: dot 1s infinite; }
	.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; } .dots i:nth-child(4) { animation-delay: .45s; } .dots i:nth-child(5) { animation-delay: .6s; }
	@keyframes dot { 30% { opacity: 1; background: var(--orange); } }
	.fade { opacity: 0; pointer-events: none; }

	#login { position: fixed; inset: var(--top) 0 0 0; z-index: 8800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; background: rgba(0, 0, 0, .35); backdrop-filter: blur(26px) saturate(1.2); transition: opacity .45s; }
	#login .big { font-size: 64px; font-weight: 300; line-height: 1; }
	#login .date { opacity: .8; margin-bottom: 26px; }
	.avatar { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #e95420, #77216f); box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
	#login .who { font-size: 20px; font-weight: 500; }
	#login .btns-login { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; width: 240px; }
	#login .lbtn { display: block; width: 100%; padding: 10px 0; border-radius: 10px; border: 0; background: var(--orange); color: #fff; font-size: 14px; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer; }
	#login .lbtn:hover { filter: brightness(1.1); }

	/* ── top bar ── */
	#topbar { position: fixed; left: 0; right: 0; top: 0; height: var(--top); z-index: 8900; background: var(--bar); color: #fff; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; user-select: none; }
	#appName { padding: 0 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#topbar .pill { height: 24px; padding: 0 12px; border-radius: 99px; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
	#topbar .pill:hover, #topbar .pill.on { background: rgba(255, 255, 255, .16); }
	#clock { font-weight: 500; cursor: default; }
	.tray { justify-self: end; display: flex; gap: 2px; align-items: center; }
	.tray svg { width: 16px; height: 16px; fill: #fff; }

	.menu { position: fixed; z-index: 8950; min-width: 230px; padding: 8px; border-radius: 14px; background: #2a2a2a; color: #fff; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); display: none; }
	.menu.open { display: block; animation: pop .14s ease-out; }
	.menu .mi { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
	.menu .mi:hover { background: rgba(255, 255, 255, .1); }
	.menu hr { border: 0; border-top: 1px solid rgba(255, 255, 255, .1); margin: 6px 4px; }
	#sysmenu { right: 8px; top: calc(var(--top) + 6px); }

	/* ── desktop icons ── */
	#desktop { position: fixed; inset: var(--top) 0 0 0; z-index: 1; }
	#dicons { position: absolute; left: 14px; top: 14px; bottom: 14px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 98px); grid-auto-columns: 96px; gap: 4px; }
	.di { padding: 8px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; text-align: center; font-size: 13px; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); cursor: pointer; user-select: none; }
	.di svg { width: 50px; height: 50px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .3)); }
	.di:hover { background: rgba(255, 255, 255, .15); }

	/* ── windows (Yaru-ish) ── */
	.win { position: absolute; min-width: 320px; min-height: 200px; background: var(--win); border-radius: 12px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .18), 0 18px 50px rgba(0, 0, 0, .45); display: flex; flex-direction: column; overflow: hidden; resize: both; animation: pop .16s ease-out; }
	@keyframes pop { from { transform: scale(.95); opacity: 0; } }
	.win.min { display: none; }
	.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; resize: none; }
	.hb { height: 46px; flex: none; display: flex; align-items: center; padding: 0 8px 0 12px; background: var(--head); border-bottom: 1px solid var(--line); cursor: grab; user-select: none; gap: 8px; }
	.win:not([data-active='1']) .hb { background: #f2f2f2; color: #999; }
	.hb:active { cursor: grabbing; }
	.hb .t { flex: 1; text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 84px; }
	.hb .ctl { display: flex; gap: 8px; }
	.hb .ctl button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .08); cursor: pointer; display: grid; place-items: center; padding: 0; }
	.hb .ctl button:hover { background: rgba(0, 0, 0, .16); }
	.hb .ctl button.x:hover { background: var(--orange); color: #fff; }
	.hb .ctl svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.6; fill: none; }
	.content { flex: 1; overflow: auto; position: relative; }
	.pad { padding: 16px 20px; line-height: 1.65; }

	/* files */
	.files { display: flex; height: 100%; }
	.files aside { width: 180px; flex: none; background: #f0f0f0; border-right: 1px solid var(--line); padding: 8px; }
	.files aside .pl { padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
	.files aside .pl svg { width: 18px; height: 18px; }
	.files aside .pl:hover { background: rgba(0, 0, 0, .05); }
	.files aside .pl.on { background: var(--sel); color: var(--orange); font-weight: 500; }
	.files main { flex: 1; overflow: auto; display: flex; flex-direction: column; }
	.crumb { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
	.crumb .c { padding: 3px 10px; border-radius: 99px; background: rgba(0, 0, 0, .06); color: var(--text); cursor: pointer; }
	.crumb .c:last-child { font-weight: 700; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; padding: 14px; }
	.fi { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 10px; cursor: pointer; text-align: center; font-size: 12.5px; line-height: 1.3; word-break: break-word; color: inherit; text-decoration: none; }
	.fi svg { width: 56px; height: 56px; }
	.fi:hover { background: var(--sel); }
	.rows { padding: 6px 10px; }
	.row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 90px; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
	.row:hover { background: var(--sel); }
	.row svg { width: 28px; height: 28px; }
	.row .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.row .sub { color: var(--muted); font-size: 12px; }
	.row .vn { justify-self: end; font-size: 12px; font-weight: 700; color: #fff; background: var(--orange); border-radius: 6px; padding: 1px 8px; }
	.foot { margin-top: auto; padding: 8px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

	/* text editor */
	.editor { font: 15px/1.7 var(--mono); padding: 10px 0; }
	.ln { display: flex; }
	.ln .no { width: 44px; flex: none; text-align: right; padding-right: 14px; color: #b0b0b0; user-select: none; }
	.ln .tx { white-space: pre-wrap; padding-right: 16px; }
	.md-h { color: var(--orange); font-weight: 700; }
	.md-q { color: #888; font-style: italic; }
	.md-b { color: #77216f; }

	/* document viewer */
	.doc { background: #d8d8d8; min-height: 100%; padding: 18px; }
	.page { max-width: 640px; margin: 0 auto; background: #fff; padding: 26px 30px; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); line-height: 1.6; }
	.page h2 { margin: 6px 0 10px; font-size: 19px; line-height: 1.35; color: #222; }
	.page img { width: 100%; border-radius: 6px; margin: 10px 0; border: 1px solid var(--line); }
	.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
	.btns a { padding: 5px 14px; border-radius: 99px; background: #f0f0f0; text-decoration: none; color: var(--text); font-size: 13px; }
	.btns a:hover { background: var(--orange); color: #fff; }
	.chip { display: inline-block; padding: 0 8px; border-radius: 6px; background: var(--orange); color: #fff; font-size: 12px; font-weight: 700; }

	/* photos */
	.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; padding: 4px; }
	.photos img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: zoom-in; display: block; }

	/* news (calendar agenda) */
	.agenda { padding: 8px 18px 18px; }
	.agenda h4 { margin: 18px 0 6px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
	.ev { display: grid; grid-template-columns: 54px 4px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
	.ev .d { text-align: right; font-weight: 700; color: #555; font-size: 13px; line-height: 1.2; }
	.ev .d small { display: block; font-weight: 400; color: var(--muted); }
	.ev .bar { border-radius: 4px; }
	.ev .tx { line-height: 1.5; }

	/* ── Junyao Code (Claude Code style chat) ── */
	.cc { background: #1f1e1d; color: #e8e6e3; font: 14.5px/1.55 var(--mono); height: 100%; display: flex; flex-direction: column; }
	.cc .dim { color: #8f8b85; }
	.cc-scroll { flex: 1; overflow: auto; padding: 14px 16px 6px; }
	.cc-welcome { display: flex; gap: 16px; align-items: center; border: 1px solid #d97757; border-radius: 10px; padding: 12px 16px; }
	.cc-welcome .ttl { font-weight: 700; }
	.cc-welcome .ttl span { color: #d97757; }
	.clawd { width: 66px; flex: none; }
	.clawd .eyes { transform-origin: center 5.5px; animation: blink 4s infinite; }
	@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
	.busy .clawd { animation: hop .5s infinite; }
	@keyframes hop { 50% { transform: translateY(-4px); } }
	.cc-tips { margin: 12px 2px 4px; }
	.cc-tips ol { margin: 4px 0 0; padding-left: 22px; }
	.cc-log > div { margin-top: 12px; }
	.cc-user { color: #a9a49c; background: #2b2a28; border-radius: 6px; padding: 4px 10px; white-space: pre-wrap; }
	.cc-msg { display: flex; gap: 8px; }
	.cc-msg .dot, .cc-tool .dot { flex: none; }
	.cc-msg .body { white-space: pre-wrap; }
	.cc-msg .body a { color: #e3a07f; }
	.cc-msg .body b { color: #fff; }
	.cc-tool .dot { color: #6cc070; }
	.cc-tool b { color: #fff; }
	.cc-out { color: #8f8b85; padding-left: 4px; margin-top: 0 !important; white-space: pre-wrap; }
	.cc-spin { color: #d97757; }
	.cc-spin .s { display: inline-block; width: 1ch; }
	.cc-box { margin: 6px 12px 0; border: 1px solid #5a5651; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
	.cc-box:focus-within { border-color: #8f8b85; }
	.cc-box span { color: #8f8b85; }
	.cc-box input { flex: 1; background: transparent; border: 0; outline: 0; color: #e8e6e3; font: inherit; }
	.cc-box input::placeholder { color: #6f6b66; }
	.cc-foot { display: flex; justify-content: space-between; gap: 10px; padding: 6px 14px 10px; font-size: 12.5px; color: #8f8b85; flex-wrap: wrap; }
	.cc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
	.cc-chips button { border: 1px solid #4a4743; background: transparent; color: #cfcac3; border-radius: 99px; padding: 2px 10px; cursor: pointer; font: 12.5px var(--mono); }
	.cc-chips button:hover { border-color: #d97757; color: #fff; }

	/* ── lightbox ── */
	#lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); z-index: 9500; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
	#lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 8px; }

	/* 登录前隐藏桌面图标 */
	body.locked #dicons { display: none; }

	@media (max-width: 680px) {
		#dicons { grid-template-rows: repeat(auto-fill, 90px); grid-auto-columns: 84px; }
		.win { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 12px) !important; resize: none; }
		.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
		.hb .t { padding-left: 0; text-align: left; }
		.files aside { display: none; }
		#topbar .hide-sm { display: none; }
	}
</style>
</head>

/* ═══════════ generated wallpaper ═══════════ */
// 固定种子：每次打开都是同一张壁纸
const P = ['#2c001e', '#77216f', '#e95420', '#ffb36b'];
let seed = 20260329;
const rnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed / 2147483647) * (b - a); };
function genWallpaper() {
	const W = 1920, H = 1080;
	const wave = (y0, amp, f, ph) => {
		let d = `M0 ${y0.toFixed(1)}`;
		for (let x = 0; x <= W; x += 32) {
			const y = y0 + Math.sin((x / W) * Math.PI * 2 * f + ph) * amp + Math.sin((x / W) * Math.PI * 5.3 * f + ph * 1.7) * amp * 0.22;
			d += ` L${x} ${y.toFixed(1)}`;
		}
		return d;
	};
	let stars = '', bokeh = '', fills = '', lines = '';
	for (let i = 0; i < 70; i++) stars += `<circle cx="${rnd(0, W).toFixed(0)}" cy="${rnd(0, H * 0.55).toFixed(0)}" r="${rnd(0.6, 2.2).toFixed(1)}" fill="#fff" opacity="${rnd(0.08, 0.5).toFixed(2)}"/>`;
	for (let i = 0; i < 7; i++) bokeh += `<circle cx="${rnd(0, W).toFixed(0)}" cy="${rnd(0, H).toFixed(0)}" r="${rnd(60, 220).toFixed(0)}" fill="${P[3]}" opacity="${rnd(0.03, 0.08).toFixed(2)}"/>`;
	const n = 6;
	for (let i = 0; i < n; i++) {
		const y0 = H * (0.42 + i * 0.09) + rnd(-50, 50);
		fills += `<path d="${wave(y0, rnd(50, 150), rnd(0.5, 1.4), rnd(0, 6.28))} L${W} ${H} L0 ${H} Z" fill="url(#w${i % 2})" opacity="${rnd(0.2, 0.42).toFixed(2)}"/>`;
	}
	const baseY = H * rnd(0.45, 0.6), amp = rnd(80, 160), f = rnd(0.6, 1.1), ph = rnd(0, 6.28);
	for (let i = 0; i < 18; i++) lines += `<path d="${wave(baseY + i * 9, amp + i * 4, f, ph + i * 0.05)}" fill="none" stroke="#fff" stroke-width="1.2" opacity="${(0.03 + (i % 5) * 0.012).toFixed(3)}"/>`;
	return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[0]}"/><stop offset=".6" stop-color="${P[1]}"/><stop offset="1" stop-color="${P[2]}"/></linearGradient>
			<radialGradient id="glow" cx="${rnd(0.6, 0.9).toFixed(2)}" cy="${rnd(0.1, 0.3).toFixed(2)}" r=".65"><stop offset="0" stop-color="${P[3]}" stop-opacity=".55"/><stop offset="1" stop-color="${P[3]}" stop-opacity="0"/></radialGradient>
			<linearGradient id="w0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${P[2]}"/><stop offset="1" stop-color="${P[1]}"/></linearGradient>
			<linearGradient id="w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P[1]}"/><stop offset="1" stop-color="${P[3]}"/></linearGradient>
		</defs>
		<rect width="${W}" height="${H}" fill="url(#bg)"/><rect width="${W}" height="${H}" fill="url(#glow)"/>
		${stars}${bokeh}${fills}${lines}
	</svg>`;
}

/* ═══════════ window manager ═══════════ */
let z = 10, cascade = 0;
const wins = {};
const desktop = document.getElementById('desktop');
function openWin(id, app) {
	app = app || APPS[id];
	closeMenus();
	if (wins[id]) { wins[id].el.classList.remove('min'); focus(id); return wins[id]; }
	const el = document.createElement('div');
	el.className = 'win';
	const dw = innerWidth, dh = innerHeight - 32;
	const W = Math.min(app.w, dw - 24), H = Math.min(app.h, dh - 24);
	el.style.width = W + 'px'; el.style.height = H + 'px';
	el.style.left = Math.max(10, (dw - W) / 2 - 40 + (cascade % 5) * 32) + 'px';
	el.style.top = Math.max(10, (dh - H) / 2 - 30 + (cascade % 5) * 26) + 'px';
	cascade++;
	const X = '<svg viewBox="0 0 10 10">';
	el.innerHTML = `<div class="hb"><span class="t"></span><div class="ctl"><button class="mn" title="Minimize">${X}<path d="M1 5h8"/></svg></button><button class="mx" title="Maximize">${X}<rect x="1.5" y="1.5" width="7" height="7"/></svg></button><button class="x" title="Close">${X}<path d="M2 2l6 6M8 2l-6 6"/></svg></button></div></div><div class="content"></div>`;
	desktop.appendChild(el);
	const w = (wins[id] = { id, el, app, state: app.state ? app.state() : {} });
	el.addEventListener('pointerdown', () => focus(id));
	el.querySelector('.x').onclick = e => { e.stopPropagation(); el.remove(); delete wins[id]; updateAppName(); };
	el.querySelector('.mn').onclick = e => { e.stopPropagation(); el.classList.add('min'); el.dataset.active = ''; updateAppName(); };
	el.querySelector('.mx').onclick = () => el.classList.toggle('max');
	el.querySelector('.hb').ondblclick = () => el.classList.toggle('max');
	if (id === 'files') el.querySelector('.content').addEventListener('click', e => filesClick(w, e));
	drag(el, el.querySelector('.hb'));
	refresh(w);
	app.mount && app.mount(w);
	focus(id);
	return w;
}
function refresh(w) {
	w.el.querySelector('.t').textContent = w.app.title(w);
	w.el.querySelector('.content').innerHTML = w.app.render(w);
}
function focus(id) {
	Object.values(wins).forEach(x => (x.el.dataset.active = ''));
	wins[id].el.style.zIndex = ++z; wins[id].el.dataset.active = '1';
	updateAppName();
}
function drag(el, handle) {
	handle.addEventListener('pointerdown', e => {
		if (e.target.closest('button') || el.classList.contains('max') || innerWidth <= 680) return;
		const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
		const move = ev => { el.style.left = ev.clientX - sx + 'px'; el.style.top = Math.max(0, ev.clientY - sy) + 'px'; };
		const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
		addEventListener('pointermove', move); addEventListener('pointerup', up);
	});
}

function ccMount(w) {
	const c = w.el, inp = c.querySelector('.cc-box input');
	w.cc = { busy: false, skip: false };
	setTimeout(() => inp.focus(), 60);
	c.querySelector('.cc').addEventListener('click', e => {
		const b = e.target.closest('.cc-chips button');
		if (b) ccSubmit(w, b.textContent);
		else if (!getSelection().toString() && !e.target.closest('a')) inp.focus();
	});
	inp.addEventListener('keydown', e => {
		if (e.key === 'Enter') ccSubmit(w, inp.value);
		if (e.key === 'Escape' && w.cc.busy) w.cc.skip = true;
		if (e.key === '?' && !inp.value) { e.preventDefault(); ccSubmit(w, '/help'); }
	});
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function ccSubmit(w, q) {
	q = q.trim();
	const c = w.el, log = c.querySelector('.cc-log'), sc = c.querySelector('.cc-scroll'), inp = c.querySelector('.cc-box input');
	if (!q || w.cc.busy) return;

	const add = html => { const d = document.createElement('div'); d.innerHTML = html; log.appendChild(d.firstElementChild); sc.scrollTop = sc.scrollHeight; return log.lastElementChild; };
	add(`<div class="cc-user">&gt; ${esc(q)}</div>`);
	if (q === '/clear') { log.innerHTML = ''; return; }
	w.cc.busy = true; w.cc.skip = false; c.classList.add('busy');

	const steps = answer(q);
	const verbs = ['Pondering', 'Reading papers', 'Brewing coffee', 'Synthesizing', 'Recalling'];
	const sp = add(`<div class="cc-spin"><span class="s">✻</span> <span>${verbs[Math.floor(Math.random() * verbs.length)]}…</span> <span class="dim">(esc to interrupt)</span></div>`);
	const glyphs = ['·', '✢', '✳', '✶', '✻', '✽', '✻', '✶', '✳', '✢'];
	let gi = 0;
	const spin = setInterval(() => (sp.querySelector('.s').textContent = glyphs[gi++ % glyphs.length]), 110);
	for (let t = 0; t < 900 + Math.random() * 600 && !w.cc.skip; t += 50) await sleep(50);
	clearInterval(spin); sp.remove();

	for (const s of steps) {
		if (s.tool) {
			add(`<div class="cc-tool"><span class="dot">⏺</span> <b>${s.tool[0]}</b>(${esc(s.tool[1])})</div>`);
			add(`<div class="cc-out">  ⎿  ${s.out}</div>`);
			if (!w.cc.skip) await sleep(320);
		}
		if (s.text) {
			const m = add(`<div class="cc-msg"><span class="dot">⏺</span><div class="body"></div></div>`);
			await stream(w, m.querySelector('.body'), s.text, sc);
		}
		if (s.act) s.act();
	}
	w.cc.busy = false; c.classList.remove('busy');
	inp.focus();
}
async function stream(w, el, html, sc) {
	const toks = html.match(/<[^>]+>|&[a-z#0-9]+;|[\s\S]/gi) || [];
	let buf = '';
	for (let i = 0; i < toks.length; i++) {
		buf += toks[i];
		if (w.cc.skip) continue;
		if (i % 3 === 0) { el.innerHTML = buf; sc.scrollTop = sc.scrollHeight; await sleep(12); }
	}
	el.innerHTML = buf; sc.scrollTop = sc.scrollHeight;
}

const OPEN_TARGETS = [[/photo|gallery|picture/i, 'gallery'], [/paper|publication/i, 'papers'], [/blog|post/i, 'blog'], [/news|calendar/i, 'news'], [/readme|about/i, 'about'], [/file|home/i, 'files'], [/trash/i, 'trash']];
function openTarget(k) { if (k === 'papers') openFiles('papers'); else if (k === 'blog') openFiles('blog'); else openWin(k); }
function paperText(p) {
	const links = p.links.map(([l, h]) => `<a href="${h}" target="_blank">${l}</a>`).join(' · ');
	return `<b>${p.title}</b> (${p.venue}, ${p.role.toLowerCase()})\n${p.tldr}${links ? '\n' + links : ''}`;
}
function answer(q) {
	const has = re => re.test(q);
	if (/^\/?help$/i.test(q)) return [{ text:
		'Things you can ask me:\n  • <b>what are you working on?</b>\n  • <b>show me your papers</b> / ask about <b>Garments2Look</b>, <b>ExtDM</b>…\n  • <b>any recent news?</b>\n  • <b>how can I contact you?</b>\n  • <b>open photos</b> / <b>open blog</b>\nCommands: <b>/clear</b> · <b>/help</b>' }];
	const om = q.match(/^open\s+(.+)$/i);
	if (om) {
		const t = OPEN_TARGETS.find(([re]) => re.test(om[1]));
		if (t) return [{ tool: ['Open', t[1]], out: 'Launched', act: () => openTarget(t[1]) }, { text: 'Done — it is on your screen now.' }];
	}
	for (const [i, re] of [[0, /garment|try-?on|vton|outfit/i], [3, /extdm|video pred/i], [2, /emotion/i], [1, /dra|motion transfer/i]]) {
		if (has(re)) return [{ tool: ['Read', `papers/${PAPERS[i].short}.pdf`], out: 'Read 1 paper' }, { text: paperText(PAPERS[i]) + '\nOpening it in the Document Viewer…', act: () => openPaper(i) }];
	}
	if (has(/hello|^hi\b|hey/i)) return [{ text: "Hi there! 👋 I'm Junyao's scripted assistant. Ask me about his research, papers, news, or how to reach him." }];
	if (has(/claude|real ai|are you (an )?ai|gpt|llm|model/i)) return [{ text: "Honest answer: I'm not a real AI. Every reply here is pre-written — this window only borrows the look of a coding-agent CLI for fun." }];
	if (has(/news|recent|latest|update/i)) return [
		{ tool: ['Read', 'news.ics'], out: `Read ${NEWS.length} events` },
		{ text: 'Most recent:\n' + NEWS.slice(0, 5).map(n => `  <b>${n[0]}</b>  ${n[2]}`).join('\n') },
	];
	if (has(/contact|email|mail|reach|wechat/i)) return [{ text:
		`📧 <a href="mailto:${EMAIL}">${EMAIL}</a>\n🐙 GitHub: <a href="https://github.com/JunyaoHu" target="_blank">JunyaoHu</a>\n🎓 <a href="${SCHOLAR}" target="_blank">Google Scholar</a>\nEmail is the fastest way to reach me.` }];
	if (has(/collab|hire|job|intern|work with/i)) return [{ text:
		"I'd love to collaborate on anything around creative content — fashion, film, video, art or emotion-aware generation. Drop me an email with a short intro and idea 🥰" }];
	if (has(/film|movie|festival/i)) return [{ text:
		'🎬 One of my films was selected as a <b>Finalist</b> at the First AMC AI Film Festival (HKUST, 2025). On the research side: ExtDM (video prediction) and DRA-MTransfer (motion transfer).' }];
	if (has(/blog|post|article|note/i)) return [
		{ tool: ['Glob', 'blog/**/*.md'], out: 'Found 44 files' },
		{ text: BLOG.map(b => `  📁 <b>${b.name}</b> — ${b.n} posts`).join('\n') + '\nSay "open blog" to browse them.' },
	];
	if (has(/photo|gallery|picture/i)) return [{ tool: ['Open', 'Photos'], out: 'Launched', act: () => openWin('gallery') }, { text: 'Here are some moments from the lab, friends and travels 📷' }];
	if (has(/fashion|cloth/i)) return [{ text:
		"👔 I work at PolyU's School of Fashion and Textiles. My main fashion project is <b>Garments2Look</b> — outfit-level virtual try-on with layering and accessories. Ask me \"tell me about Garments2Look\"." }];
	if (has(/paper|publication|research|working on|work on|cvpr/i)) return [
		{ tool: ['Read', 'src/data/papers.ts'], out: `Found ${PAPERS.length} papers` },
		{ text: 'I work on <b>creative content production</b> with generative models — fashion, video, emotion and art.\n\n' +
			PAPERS.map(p => `  <b>${p.venue.padEnd(8)}</b> ${p.short} — ${p.role.toLowerCase()}`).join('\n') +
			'\n\nAsk about any of them by name, or say "open papers".' },
	];
	if (has(/who|about|yourself|introduce|junyao/i)) return [{ tool: ['Read', 'README.md'], out: 'Read 19 lines' }, { text:
		"I'm <b>Junyao Hu</b>, a research assistant at PolyU's School of Fashion and Textiles, supervised by Dr. Xingxing Zou. Before that I studied at CUMT. I like turning AI into things people can see and feel ✨" }];
	return [{ text: `Hmm, I'm only a scripted demo and don't know how to answer "${esc(q)}" yet. Try <b>/help</b>, or ask about papers, news or contact.` }];
}

const loginEl = document.getElementById('login');
function showLogin() {
	tick();
	document.body.classList.add('locked');
	loginEl.style.display = 'flex';
	requestAnimationFrame(() => loginEl.classList.remove('fade'));
}
let firstLogin = true;
function signIn() {
	if (loginEl.classList.contains('fade')) return;
	loginEl.classList.add('fade'); setTimeout(() => (loginEl.style.display = 'none'), 450);
	document.body.classList.remove('locked');
	if (firstLogin) {
		firstLogin = false;
		setTimeout(() => openWin('about'), 350);
	}
}
document.getElementById('signIn').addEventListener('click', signIn);

document.getElementById('wall').innerHTML = genWallpaper();
tick();
const splash = document.getElementById('splash');
const endSplash = () => { if (!splash.isConnected) return; splash.classList.add('fade'); setTimeout(() => splash.remove(), 500); };
splash.onclick = endSplash;
setTimeout(endSplash, 1500);
</script>
